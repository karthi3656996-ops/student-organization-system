<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#hack-bg)" />
  <rect width="800" height="450" fill="url(#grid-pattern)" opacity="0.4" />

  <!-- Glowing circuits -->
  <path d="M 50,100 L 220,100 L 280,180 L 400,180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" />
  <circle cx="50" cy="100" r="4" fill="#06b6d4" />
  <circle cx="400" cy="180" r="4" fill="#06b6d4" />

  <path d="M 750,350 L 580,350 L 520,270 L 400,270" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4" />
  <circle cx="750" cy="350" r="4" fill="#3b82f6" />
  <circle cx="400" cy="270" r="4" fill="#3b82f6" />

  <!-- Center Terminal Window Graphic -->
  <g transform="translate(250, 80)">
    <rect width="300" height="200" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <!-- Header bar -->
    <rect width="300" height="28" rx="12" fill="#1e293b" />
    <circle cx="20" cy="14" r="5" fill="#ef4444" />
    <circle cx="36" cy="14" r="5" fill="#f59e0b" />
    <circle cx="52" cy="14" r="5" fill="#10b981" />
    <text x="150" y="19" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">terminal ~ hackathon.py</text>

    <!-- Code lines -->
    <text x="24" y="60" font-family="monospace" font-size="14" font-weight="700" fill="#06b6d4">&gt; skyline_hackathon()</text>
    <text x="24" y="90" font-family="monospace" font-size="12" fill="#a5f3fc">{ status: "BUILDING_FUTURE",</text>
    <text x="40" y="115" font-family="monospace" font-size="12" fill="#38bdf8">duration: "36_HOURS",</text>
    <text x="40" y="140" font-family="monospace" font-size="12" fill="#34d399">prize_pool: "₹1,50,000" }</text>
    <text x="24" y="170" font-family="monospace" font-size="14" font-weight="700" fill="#a855f7">&lt;deploying live solution&gt;</text>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">CAMPUS TECH HACKATHON</text>
  <text x="400" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">ENGINEERING &bull; INNOVATION &bull; RAPID PROTOTYPING</text>

  <!-- Tag -->
  <rect x="25" y="25" width="130" height="30" rx="15" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="90" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">TECHNICAL</text>
</svg>
