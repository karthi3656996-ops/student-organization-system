<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sports-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="field-glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sports-bg)" />
  <rect width="800" height="450" fill="url(#field-glow)" />

  <!-- Stadium track curves -->
  <ellipse cx="400" cy="220" rx="260" ry="110" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="10 6" opacity="0.5" />
  <ellipse cx="400" cy="220" rx="210" ry="85" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.4" />

  <!-- Trophy Icon Centerpiece -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="55" fill="#047857" stroke="#a7f3d0" stroke-width="2" />
    <!-- Golden Trophy -->
    <path d="M-22,-20 L22,-20 L16,8 C14,18 0,22 0,22 C0,22 -14,18 -16,8 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <!-- Handles -->
    <path d="M-22,-14 C-32,-14 -32,2 -18,2" fill="none" stroke="#fbbf24" stroke-width="3" />
    <path d="M22,-14 C32,-14 32,2 18,2" fill="none" stroke="#fbbf24" stroke-width="3" />
    <!-- Base -->
    <path d="M-6,22 L-6,30 L-14,34 L14,34 L6,30 L6,22 Z" fill="#f59e0b" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">CAMPUS ATHLETICS &amp; SPORTS MEET</text>
  <text x="400" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">INTER-DEPARTMENT TOURNAMENT &bull; TRACK &amp; FIELD</text>

  <!-- Tag -->
  <rect x="25" y="25" width="110" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="80" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">SPORTS</text>
</svg>
