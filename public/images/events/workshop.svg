<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="work-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#work-bg)" />

  <!-- Presentation Screen / Chart Graphic -->
  <g transform="translate(400, 190)">
    <rect x="-130" y="-80" width="260" height="150" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <!-- Bar charts -->
    <rect x="-90" y="10" width="24" height="40" rx="4" fill="#60a5fa" />
    <rect x="-50" y="-20" width="24" height="70" rx="4" fill="#3b82f6" />
    <rect x="-10" y="-45" width="24" height="95" rx="4" fill="#2563eb" />
    <rect x="30" y="-10" width="24" height="60" rx="4" fill="#1d4ed8" />
    <rect x="70" y="-60" width="24" height="110" rx="4" fill="#38bdf8" />
    <!-- Stand -->
    <path d="M0,70 L0,95 L-40,110 M0,95 L40,110" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">LEADERSHIP &amp; CAREER WORKSHOP</text>
  <text x="400" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="1">GUEST LECTURE &bull; RESUME CLINIC &bull; NETWORKING</text>

  <!-- Tag -->
  <rect x="25" y="25" width="130" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="90" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">WORKSHOP</text>
</svg>
