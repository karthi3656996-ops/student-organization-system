<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gala-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <radialGradient id="stage-glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="beam-left" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beam-right" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#gala-bg)" />
  <rect width="800" height="450" fill="url(#stage-glow)" />

  <!-- Spotlight Beams -->
  <polygon points="100,0 260,0 520,450 320,450" fill="url(#beam-left)" />
  <polygon points="700,0 540,0 280,450 480,450" fill="url(#beam-right)" />

  <!-- Chandelier / Festive Lights -->
  <g opacity="0.6">
    <circle cx="200" cy="80" r="3" fill="#fde68a" />
    <circle cx="240" cy="110" r="4" fill="#fde68a" />
    <circle cx="300" cy="70" r="2.5" fill="#fde68a" />
    <circle cx="500" cy="75" r="3" fill="#fde68a" />
    <circle cx="560" cy="105" r="4.5" fill="#fde68a" />
    <circle cx="620" cy="85" r="2.5" fill="#fde68a" />
  </g>

  <!-- Stage Platform -->
  <ellipse cx="400" cy="380" rx="280" ry="45" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <ellipse cx="400" cy="375" rx="260" ry="38" fill="#0f172a" />

  <!-- Gala Emblem Centerpiece -->
  <g transform="translate(400, 240)">
    <!-- Outer Golden Ring -->
    <circle r="75" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-dasharray="8 4" />
    <circle r="65" fill="#1e1b4b" stroke="#e0e7ff" stroke-width="1.5" />

    <!-- Musical & Award Icon -->
    <path d="M-18,-15 L-18,22 C-18,28 -25,32 -32,30 C-38,28 -40,20 -35,15 C-30,10 -22,12 -18,16 L-18,-5 L18,-15 L18,12 C18,18 11,22 4,20 C-2,18 -4,10 1,5 C6,0 14,2 18,6 L18,-25 Z" fill="url(#gold-grad)" />

    <!-- Star sparkles -->
    <polygon points="0,-45 4,-35 15,-35 6,-28 10,-17 0,-24 -10,-17 -6,-28 -15,-35 -4,-35" fill="#fef08a" />
  </g>

  <!-- Skyline Gala Typography -->
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">SKYLINE ANNUAL SPRING GALA</text>
  <text x="400" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">CAMPUS BANQUET &bull; AWARDS CEREMONY &bull; LIVE PERFORMANCES</text>

  <!-- Badge Top Corner -->
  <rect x="25" y="25" width="140" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="95" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">FLAGSHIP EVENT</text>
</svg>
