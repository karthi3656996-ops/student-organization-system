<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="def-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#def-canvas)" />
  <circle cx="300" cy="300" r="220" fill="#e0e7ff" opacity="0.4" />

  <g transform="translate(300, 270)">
    <circle cx="0" cy="0" r="70" fill="#eff6ff" stroke="#3b82f6" stroke-width="3" />
    <!-- Shopping bag vector -->
    <path d="M-30,-20 L30,-20 L40,40 L-40,40 Z" fill="#2563eb" />
    <path d="M-15,-20 C-15,-40 15,-40 15,-20" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="300" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Skyline Official Merchandise</text>
  <text x="300" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Student Association Gear &amp; Apparel</text>
</svg>
