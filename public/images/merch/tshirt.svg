<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="tshirt-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="tee-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#tshirt-canvas)" />
  <circle cx="300" cy="300" r="240" fill="#dbeafe" opacity="0.5" />

  <!-- T-Shirt Vector Shape -->
  <g transform="translate(300, 290)">
    <!-- Body & Sleeves -->
    <path d="M-55,-160 
             C-25,-140 25,-140 55,-160 
             L115,-120 L165,-60 L125,-15 L90,-50 L90,160 
             L-90,160 L-90,-50 L-125,-15 L-165,-60 L-115,-120 Z" 
          fill="url(#tee-fabric)" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round" />

    <!-- Crew Neck Collar -->
    <path d="M-55,-160 C-30,-125 30,-125 55,-160" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" />

    <!-- Center Screen-Print Typography -->
    <g transform="translate(0, -20)">
      <rect x="-70" y="-35" width="140" height="70" rx="8" fill="#172554" opacity="0.4" />
      <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SKYLINE</text>
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#93c5fd" stroke-width="2" />
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#bfdbfe" text-anchor="middle" letter-spacing="2">EST. 2026 &bull; CAMPUS CREW</text>
    </g>
  </g>

  <!-- Product Label Details -->
  <text x="300" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Association Crest T-Shirt</text>
  <text x="300" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">100% Organic Ring-Spun Cotton &bull; Royal Blue</text>
</svg>
