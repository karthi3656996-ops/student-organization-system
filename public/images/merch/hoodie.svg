<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hoodie-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="hoodie-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="crest-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#hoodie-canvas)" />
  <circle cx="300" cy="300" r="240" fill="#e0e7ff" opacity="0.4" />

  <!-- Hoodie Vector Shape -->
  <g transform="translate(300, 290)">
    <!-- Body & Sleeves -->
    <path d="M-60,-170 
             C-30,-155 30,-155 60,-170 
             L110,-120 L180,-70 L150,-10 L100,-50 L100,160 
             L-100,160 L-100,-50 L-150,-10 L-180,-70 L-110,-120 Z" 
          fill="url(#hoodie-fabric)" stroke="#334155" stroke-width="3" stroke-linejoin="round" />

    <!-- Hood -->
    <path d="M-60,-170 C-90,-140 -80,-80 -50,-80 C-20,-80 -10,-110 0,-110 C10,-110 20,-80 50,-80 C80,-80 90,-140 60,-170 Z" 
          fill="#334155" />
    
    <!-- Drawstrings -->
    <path d="M-20,-80 L-22, -10 M20,-80 L22, -10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <circle cx="-22" cy="-10" r="4" fill="#cbd5e1" />
    <circle cx="22" cy="-10" r="4" fill="#cbd5e1" />

    <!-- Kangaroo Pocket -->
    <path d="M-60,70 L60,70 L50,140 L-50,140 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Embroidered Skyline Crest -->
    <g transform="translate(-40, -40)">
      <circle cx="0" cy="0" r="22" fill="url(#crest-glow)" />
      <polygon points="0,-12 3,-3 12,-3 5,2 8,11 0,6 -8,11 -5,2 -12,-3 -3,-3" fill="#ffffff" />
    </g>

    <text x="15" y="-35" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="2">SKYLINE</text>
    <text x="15" y="-20" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#93c5fd" letter-spacing="1">STUDENT ASSOC.</text>
  </g>

  <!-- Product Label Details -->
  <text x="300" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Skyline Signature Club Hoodie</text>
  <text x="300" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">380 GSM Heavyweight Fleece &bull; Midnight Navy</text>
</svg>
