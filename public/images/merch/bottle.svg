<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bot-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="metal-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bot-canvas)" />
  <circle cx="300" cy="300" r="240" fill="#f1f5f9" opacity="0.8" />

  <!-- Bottle Vector Shape -->
  <g transform="translate(300, 290)">
    <!-- Cap -->
    <rect x="-24" y="-180" width="48" height="25" rx="5" fill="#0f172a" />
    <!-- Loop handle -->
    <path d="M-15,-180 C-15,-205 15,-205 15,-180" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
    <!-- Neck -->
    <rect x="-18" y="-155" width="36" height="20" fill="#475569" />
    <!-- Main Flask Body -->
    <path d="M-45,-135 C-45,-135 -40,-125 -45,-110 L-45,150 C-45,165 -30,175 0,175 C30,175 45,165 45,150 L45,-110 C40,-125 45,-135 45,-135 Z" 
          fill="url(#metal-sheen)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Laser Etched Emblem -->
    <g transform="translate(0, 10)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 2" />
      <polygon points="0,-10 3,-3 10,-3 4,1 7,8 0,4 -7,8 -4,1 -10,-3 -3,-3" fill="#cbd5e1" />
      <text x="0" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">SKYLINE</text>
    </g>
  </g>

  <!-- Product Label Details -->
  <text x="300" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">Skyline Insulated Flask 750ml</text>
  <text x="300" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Double-Wall Vacuum Insulated Stainless Steel &bull; Matte Grey</text>
</svg>
